version: '3.8'
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - MODEL_ENDPOINT=http://gemma4:18080
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      - gemma4

  gemma4:
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - --hf-repo unsloth/gemma-4-12b-it-GGUF
      - --hf-file gemma-4-12b-it-Q8_0.gguf
      - --host 0.0.0.0
      - --port 18080
      - --ctx-size 131072
    ports:
      - "18080:18080"
    volumes:
      - ./models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
